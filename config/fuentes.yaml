# ─────────────────────────────────────────────────────────────────────
#  De dónde salen los anuncios.
#  Cada "fuente" apunta a un scraper externo que se llama por API.
#  Los nombres de campos del scraper se mapean en "mapeo" -> si el actor
#  cambia un campo, se arregla acá, no en el código.
# ─────────────────────────────────────────────────────────────────────

meta:
  # Fuente PRIMARIA para anuncios comerciales de Costa Rica.
  # Raspa la interfaz web pública de la Biblioteca de Anuncios.
  tipo: apify
  actor: apify/facebook-ads-scraper
  activa: true
  # Entrada base; el pipeline le agrega "startUrls" por competidor.
  # Los valores tienen que coincidir con el esquema del actor. Verificados
  # contra api.apify.com el 2026-09-21; tests/test_fuentes.py los revisa.
  #   activeStatus: "" | active | inactive
  #   sorting:      "" | total_impressions | relevancy_monthly_grouped
  entrada_base:
    resultsLimit: 40
    activeStatus: active
    sorting: ""            # orden por defecto del actor
    isDetailsPerAd: false
    includeAboutPage: false
    # Existen también onlyAdsNewerThan / onlyAdsOlderThan. NO se usan a
    # propósito: filtrar por fecha abarataría la corrida, pero dejaríamos de
    # ver los anuncios que siguen corriendo desde antes y los que se
    # apagaron, que son justo la mitad de lo que el reporte cuenta.
  # URL de búsqueda que se arma por competidor (país fijo Costa Rica = CR).
  plantilla_url_busqueda: "https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=CR&q={consulta}&search_type=keyword_unordered"
  # El actor NO devuelve un link a la ficha pública del anuncio: se arma con
  # el id de archivo. Sin esto el reporte pierde la trazabilidad a la fuente.
  plantilla_url_anuncio: "https://www.facebook.com/ads/library/?id={id}"
  # Nombres de cada campo en la salida del actor, probados en orden.
  # Verificados contra una respuesta real el 2026-09-21 (el actor usa
  # camelCase; tests/fixtures/meta_anuncio_real.json congela esa respuesta).
  # Para revisar una respuesta nueva:
  #   python -m pulserival.cli fuentes inspeccionar --archivo datos/crudo/<archivo>
  mapeo:
    id_externo:     [adArchiveID, adArchiveId, adId, id]
    texto:          [snapshot.body.text, adText, body, text]
    titulo:         [snapshot.title, title, adTitle]
    descripcion:    [snapshot.linkDescription, snapshot.caption, linkDescription, caption]
    cta:            [snapshot.ctaText, ctaText, snapshot.ctaType]
    link_destino:   [snapshot.linkUrl, linkUrl, destinationUrl]
    creativo_url:   [snapshot.images.0.originalImageUrl, snapshot.images.0.resizedImageUrl,
                     snapshot.videos.0.videoPreviewImageUrl, snapshot.cards.0.originalImageUrl,
                     imageUrl, previewImageUrl]
    anunciante:     [pageName, snapshot.pageName, page_name]
    anunciante_id:  [pageID, pageId, page_id]
    # Las versiones "Formatted" son fechas ISO; startDate/endDate vienen como
    # marca de tiempo Unix, que en el reporte se leería como un número suelto.
    fecha_inicio:   [startDateFormatted, startDate, ad_delivery_start_time]
    fecha_fin:      [endDateFormatted, endDate, ad_delivery_stop_time]
    plataformas:    [publisherPlatform, publisher_platforms]
    formato:        [snapshot.displayFormat, displayFormat]
    categoria:      [snapshot.pageCategories, categories]
    activo:         [isActive]
    url_anuncio:    [url, adLibraryUrl]

google:
  # Fuente PRIMARIA para Google Ads. Raspa el Centro de Transparencia.
  tipo: apify
  actor: pulsedata/google-ads-transparency-scraper
  activa: true
  # Verificados contra api.apify.com el 2026-09-21.
  #   format:          ALL | TEXT | IMAGE | VIDEO
  #   platform:        ALL | SEARCH | YOUTUBE | MAPS | PLAY | SHOPPING
  #   advertiserMatch: best | all
  entrada_base:
    region: "CR"          # Costa Rica. "anywhere" para no filtrar por país.
    format: "ALL"
    platform: "ALL"
    maxAdsPerQuery: 40
    advertiserMatch: "best"
    includeDetails: true
    enrichPreviews: true
  # OJO, dato de producto: este actor NO devuelve el texto del anuncio.
  # Verificado con 15 anuncios reales el 2026-09-21: vienen el creativo, el
  # formato, las fechas, los días al aire y las variaciones, pero ni el
  # titular ni la descripción. Por eso el reporte trata a Google como señal
  # de ACTIVIDAD (cuántos anuncios, de qué tipo, desde cuándo) y no como
  # mensajes. Los campos de texto se dejan mapeados por si el actor los
  # agrega o se cambia de actor.
  mapeo:
    id_externo:     [creativeId, creative_id, id]
    texto:          [text, adText, description, headline]
    titulo:         [headline, title]
    descripcion:    [description, body]
    cta:            [callToAction, cta]
    link_destino:   [destinationUrl, finalUrl]
    creativo_url:   [previewImageUrl, imageUrls.0, thumbnailUrl]
    # Los anuncios de video no traen imagen, pero sí el id de YouTube.
    video_id:       [youtubeVideoId]
    video_url:      [youtubeUrl]
    anunciante:     [advertiserName, advertiser_name]
    anunciante_id:  [advertiserId, advertiser_id]
    fecha_inicio:   [firstShown, first_shown, startDate]
    fecha_fin:      [lastShown, last_shown, endDate]
    plataformas:    [platform, platforms]
    formato:        [format]
    dias_al_aire:   [daysShown]
    variaciones:    [variationsCount]
    regiones:       [regionsShownIn]
    url_anuncio:    [url, adUrl, advertiserUrl]

meta_api_oficial:
  # Fuente COMPLEMENTARIA, NO reemplaza al scraper.
  # La API oficial (ads_archive) solo devuelve anuncios políticos/de temas
  # sociales, o cualquier anuncio entregado en UE/Reino Unido (por el DSA).
  # Para un comercio tico que solo pauta en CR: devuelve vacío. Ver docs/03.
  tipo: meta_graph
  activa: false
  version_api: v21.0
  paises_por_defecto: ["CR"]
  campos:
    - id
    - ad_creative_bodies
    - ad_creative_link_titles
    - ad_creative_link_descriptions
    - ad_creative_link_captions
    - ad_delivery_start_time
    - ad_delivery_stop_time
    - ad_snapshot_url
    - page_id
    - page_name
    - publisher_platforms
    - languages

# ─────────────────────────────────────────────────────────────────────
#  Costos de los scrapers, para poder estimar antes de gastar.
#  Los usa `python3 -m pulserival.cli presupuesto`.
#  Verificados el 2026-09-21 en apify.com/pricing y en la pestaña Pricing
#  de cada actor. Actualizalos cuando cambien.
# ─────────────────────────────────────────────────────────────────────
costos:
  # En qué plan de Apify estás: free | starter | scale | business
  plan_apify: free
  # Crédito mensual incluido en el plan, en USD.
  credito_mensual_usd:
    free: 5.00
    starter: 19.00
    scale: 49.00
    business: 199.00
  # Precio por 1.000 anuncios devueltos, según plan.
  # Meta: los cuatro valores están publicados en la pestaña Pricing del actor.
  # Google: el actor publica ~$1.00/1.000; los otros escalones son una
  # estimación conservadora con el mismo patrón de descuento que Meta.
  # Si el costo te importa al centavo, confirmalo en la página del actor.
  usd_por_mil_resultados:
    meta:
      free: 5.80
      starter: 5.00
      scale: 4.20
      business: 3.40
    google:
      free: 1.20
      starter: 1.00
      scale: 0.85
      business: 0.70
