# ─────────────────────────────────────────────────────────────────────
#  De dónde salen los anuncios.
#  Cada "fuente" apunta a un scraper externo que se llama por API.
#  Los nombres de campos del scraper se mapean en "mapeo" -> si el actor
#  cambia un campo, se arregla acá, no en el código.
# ─────────────────────────────────────────────────────────────────────

meta:
  # Fuente PRIMARIA para anuncios comerciales de Costa Rica.
  # Raspa la interfaz web pública de la Biblioteca de Anuncios.
  tipo: apify
  actor: apify/facebook-ads-scraper
  activa: true
  # Entrada base; el pipeline le agrega "startUrls" por competidor.
  entrada_base:
    resultsLimit: 40
    activeStatus: active
    sorting: recent
    isDetailsPerAd: false
    includeAboutPage: false
  # URL de búsqueda que se arma por competidor (país fijo Costa Rica = CR).
  plantilla_url_busqueda: "https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=CR&q={consulta}&search_type=keyword_unordered"
  # Nombres posibles de cada campo en la salida del actor (se prueba en orden).
  # Verificalo con `python -m pulserival.cli fuentes inspeccionar --archivo <json>`.
  mapeo:
    id_externo:     [adArchiveID, ad_archive_id, adId, id]
    texto:          [adText, body, ad_creative_body, snapshot.body.text, text]
    titulo:         [title, adTitle, snapshot.title, link_title]
    descripcion:    [linkDescription, snapshot.link_description, caption]
    cta:            [ctaText, snapshot.cta_text, cta_type]
    link_destino:   [linkUrl, snapshot.link_url, destinationUrl]
    creativo_url:   [imageUrl, snapshot.images.0.original_image_url, videoPreviewImageUrl, previewImageUrl]
    anunciante:     [pageName, page_name, snapshot.page_name]
    anunciante_id:  [pageID, page_id]
    fecha_inicio:   [startDate, startDateFormatted, ad_delivery_start_time]
    fecha_fin:      [endDate, endDateFormatted, ad_delivery_stop_time]
    plataformas:    [publisherPlatform, publisher_platforms]
    url_anuncio:    [url, adLibraryUrl, snapshot.link_url]

google:
  # Fuente PRIMARIA para Google Ads. Raspa el Centro de Transparencia.
  tipo: apify
  actor: pulsedata/google-ads-transparency-scraper
  activa: true
  entrada_base:
    region: "CR"          # Costa Rica. "anywhere" para no filtrar por país.
    format: "ALL"
    platform: "ALL"
    maxAdsPerQuery: 40
    advertiserMatch: "best"
    includeDetails: true
    enrichPreviews: true
  mapeo:
    id_externo:     [creativeId, creative_id, id]
    texto:          [text, adText, description, headline]
    titulo:         [headline, title]
    descripcion:    [description, body]
    cta:            [callToAction, cta]
    link_destino:   [destinationUrl, finalUrl, url]
    creativo_url:   [previewImageUrl, imageUrls.0, thumbnailUrl]
    anunciante:     [advertiserName, advertiser_name]
    anunciante_id:  [advertiserId, advertiser_id]
    fecha_inicio:   [firstShown, first_shown, startDate]
    fecha_fin:      [lastShown, last_shown, endDate]
    plataformas:    [platform, platforms]
    url_anuncio:    [url, adUrl]

meta_api_oficial:
  # Fuente COMPLEMENTARIA, NO reemplaza al scraper.
  # La API oficial (ads_archive) solo devuelve anuncios políticos/de temas
  # sociales, o cualquier anuncio entregado en UE/Reino Unido (por el DSA).
  # Para un comercio tico que solo pauta en CR: devuelve vacío. Ver docs/03.
  tipo: meta_graph
  activa: false
  version_api: v21.0
  paises_por_defecto: ["CR"]
  campos:
    - id
    - ad_creative_bodies
    - ad_creative_link_titles
    - ad_creative_link_descriptions
    - ad_creative_link_captions
    - ad_delivery_start_time
    - ad_delivery_stop_time
    - ad_snapshot_url
    - page_id
    - page_name
    - publisher_platforms
    - languages

# ─────────────────────────────────────────────────────────────────────
#  Costos de los scrapers, para poder estimar antes de gastar.
#  Los usa `python3 -m pulserival.cli presupuesto`.
#  Verificados el 2026-09-21 en apify.com/pricing y en la pestaña Pricing
#  de cada actor. Actualizalos cuando cambien.
# ─────────────────────────────────────────────────────────────────────
costos:
  # En qué plan de Apify estás: free | starter | scale | business
  plan_apify: free
  # Crédito mensual incluido en el plan, en USD.
  credito_mensual_usd:
    free: 5.00
    starter: 19.00
    scale: 49.00
    business: 199.00
  # Precio por 1.000 anuncios devueltos, según plan.
  # Meta: los cuatro valores están publicados en la pestaña Pricing del actor.
  # Google: el actor publica ~$1.00/1.000; los otros escalones son una
  # estimación conservadora con el mismo patrón de descuento que Meta.
  # Si el costo te importa al centavo, confirmalo en la página del actor.
  usd_por_mil_resultados:
    meta:
      free: 5.80
      starter: 5.00
      scale: 4.20
      business: 3.40
    google:
      free: 1.20
      starter: 1.00
      scale: 0.85
      business: 0.70
