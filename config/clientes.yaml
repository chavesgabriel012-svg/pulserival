# ─────────────────────────────────────────────────────────────────────
#  Clientes y competidores, en un archivo que se puede versionar.
#
#  Por qué existe: la base de datos (datos/pulserival.db) no se sube al
#  repositorio. Sin este archivo, el servidor que corre el cron arranca con
#  una base vacía y la corrida no tiene a quién reportarle.
#
#  Acá NO van secretos: solo nombres públicos de competidores y el correo de
#  contacto del cliente. Las claves siguen en .env / secretos del repo.
#
#  Se aplica con:  python3 -m pulserival.cli aplicar-config
#  Es idempotente: correrlo dos veces no duplica nada. Actualiza lo que
#  cambió y desactiva (no borra) lo que sacaste del archivo.
# ─────────────────────────────────────────────────────────────────────

clientes:
  - clave: gollo
    empresa: "Gollo"
    contacto_nombre: "(cliente potencial)"
    # Dominio .invalid a propósito mientras sea una demostración: si se
    # dispara un envío por error, rebota en vez de llegarle a alguien.
    contacto_email: "demostracion@pulserival.invalid"
    periodicidad: semanal
    dia_envio: martes
    industria: "retail de electrodomésticos, muebles y tecnología"
    notas: >-
      Cadena de retail con financiamiento propio y cobertura nacional.
      Compite en electrodomésticos, muebles, tecnología y motos. Sus
      diferenciadores habituales son el crédito propio, los plazos de pago y
      la red de tiendas. Le interesa sobre todo detectar guerras de precio,
      promociones de temporada y quién está empujando financiamiento.
    activo: true
    competidores:
      - clave: monge
        nombre: "Tienda Monge"
        meta_pagina_url: "https://www.facebook.com/TiendaMonge/"
        google_dominio: "tiendamonge.com"
        prioridad: 1
        notas: "Competidor directo en electrodomésticos y muebles con crédito propio"

      - clave: siman
        nombre: "Almacenes SIMAN"
        meta_pagina_url: "https://www.facebook.com/simancostarica/"
        google_dominio: "cr.siman.com"
        prioridad: 1
        notas: "Tienda por departamentos; compite en electrodomésticos y tecnología"

      - clave: artelec
        nombre: "Artelec"
        meta_pagina_url: "https://www.facebook.com/ArtelecCR/"
        google_dominio: "artelec.cr"
        prioridad: 2
        notas: "Retail de electrodomésticos"

      - clave: mexpress
        nombre: "MExpress"
        meta_pagina_url: "https://www.facebook.com/mexpresscostarica/"
        google_dominio: "tiendamexpress.com"
        prioridad: 2
        notas: "Retail de electrodomésticos y tecnología"
