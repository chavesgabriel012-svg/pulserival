# ─────────────────────────────────────────────────────────────────────
#  Textos y datos de contacto de la landing.
#
#  Está en YAML y no en el HTML por la misma razón que los precios: cambiar
#  una frase o un número de WhatsApp no debería necesitar tocar código.
#  Después de editar acá, regenerar con:
#      python3 -m pulserival.cli landing
#
#  REGLA AL ESCRIBIR ACÁ: nada que no se pueda sostener. Sin cifras de
#  clientes, sin testimonios, sin "líderes en", sin promesas de tiempo de
#  respuesta. Lo que se promete en esta página es lo que el pipeline hace.
# ─────────────────────────────────────────────────────────────────────

marca: PulseRival
dominio: ""                      # pulserival.com, cuando lo compren

# A dónde llega el formulario de alta. Sin servidor, el formulario arma un
# mensaje de WhatsApp con los datos ya ordenados. Es el canal donde de
# verdad se cierran ventas en Costa Rica.
contacto:
  whatsapp: ""                   # solo dígitos con código de país: 50688887777
  # El correo de soporte. Sale en la sección de contacto, en el pie de todas
  # las páginas, en el botón del plan Custom y en los mensajes de error que
  # dicen "escríbanos". Si cambia, cambiarlo también en config/legal.yaml.
  email: "soporte@pulserival.com"

# La sección de contacto de la portada, antes del pie.
contacto_seccion:
  rotulo: "Contacto"
  titulo: "¿Tiene alguna pregunta?"
  texto: >-
    Sobre los planes, un plan Custom para su agencia, su suscripción o un
    reporte que ya recibió: escríbanos y le respondemos.

# Sin "mes a mes": la frecuencia depende del plan (el de $25 es cada 30 días,
# un Custom puede ser semanal o más seguido). Lo que vale para todos los
# planes es que las bibliotecas se leen cada semana.
titulo: "Qué está anunciando su competencia en Meta y Google"
subtitulo: >-
  Revisamos los anuncios activos de sus competidores en Facebook, Instagram y
  Google todas las semanas, y en cada reporte le explicamos qué cambió y qué
  conviene hacer. No una lista de anuncios: un análisis, con el enlace a
  cada anuncio para que lo compruebe.

# ── La caja de la portada: por qué PulseRival ────────────────────────
# Las diapositivas de al lado del titular. Máximo cuatro: la plantilla corta
# en la cuarta, porque más que eso nadie las ve pasar. Misma regla que todo el
# archivo: nada que el producto no haga, sin cifras que no salgan de una
# corrida y sin prometer resultados de venta.
por_que:
  rotulo: "¿Por qué usar PulseRival?"
  diapositivas:
    - titulo: "Entérese antes de que le cueste un cliente"
      texto: >-
        Cada promoción o precio nuevo de su competencia, con el anuncio a la
        vista.
    - titulo: "Sepa qué mensajes están empujando"
      texto: >-
        Lo que mantienen al aire le muestra en qué argumentos están apostando.
    - titulo: "Decida con lo que publicaron"
      texto: >-
        Qué anunciaron, qué cambiaron y qué apagaron, con el enlace para
        comprobarlo.
    - titulo: "Sin revisar nada usted mismo"
      texto: >-
        Leemos las bibliotecas cada semana y se lo damos resumido en su reporte.

# ── Las dos fuentes ──────────────────────────────────────────────────
# Lo que se lee de cada plataforma. La asimetría es real y está dicha a
# propósito: Meta publica el texto de los anuncios y Google no publica el de
# todos, así que de Google se leen señales de actividad. Prometer lo mismo de
# las dos sería inventar.
plataformas:
  titulo: "Las dos bibliotecas públicas, leídas todas las semanas"
  nota: >-
    Las dos son públicas y cualquiera puede abrirlas. Casi nadie lo hace todas
    las semanas, ni compara contra lo que había antes, ni saca conclusiones.
    Leerlas cada semana es lo que hace que un anuncio que corrió solo diez días
    no se le escape a su reporte.
  fuentes:
    - nombre: "Meta"
      donde: "Facebook e Instagram"
      biblioteca: "Biblioteca de Anuncios de Meta"
      lee:
        - "El texto completo del anuncio y su titular"
        - "La imagen o el video, y el botón que usa"
        - "Desde cuándo está al aire y a dónde manda"
        - "Cuántas variantes del mismo mensaje tiene corriendo"
    - nombre: "Google"
      donde: "Búsqueda, YouTube y Display"
      biblioteca: "Centro de Transparencia de Anuncios de Google"
      lee:
        - "Cuántos anuncios tiene activos y de qué formato"
        - "Desde cuándo corre cada uno y cuántos días lleva"
        - "Cuántas variaciones y en qué regiones aparece"
        - "El enlace a la ficha pública de cada anuncio"
      nota: >-
        Google no publica el texto de todos los anuncios. Ahí leemos actividad,
        no mensajes, y el reporte lo dice cuando es el caso.

# ── Cómo funciona ────────────────────────────────────────────────────
pasos:
  titulo: "Cómo se arma su reporte"
  lista:
    - nombre: "Recolectamos"
      texto: >-
        Cada semana leemos las dos bibliotecas para los competidores que usted
        nos indique, y guardamos cada anuncio con su ficha pública.
    - nombre: "Comparamos"
      texto: >-
        Cada anuncio se contrasta con lo que vimos antes: cuál es nuevo, cuál
        cambió el mensaje, cuál dejó de publicarse. Ese contraste es el
        producto; una foto suelta no dice nada.
    - nombre: "Interpretamos"
      texto: >-
        Qué significan esos movimientos para su negocio, en su contexto y su
        industria. Agrupado por competidor, no en una lista plana.
    - nombre: "Revisamos y enviamos"
      texto: >-
        Le llega el reporte, con la frecuencia de su plan. Ninguno sale sin que una persona
        lo lea: un control automático marca antes lo que no se sostiene, y lo
        dudoso se corrige o se dice.

# ── El ejemplo del reporte ───────────────────────────────────────────
# Una muestra de cómo llega el correo, debajo de los pasos. Existe para que
# se vea lo que más cuesta explicar con palabras: que el detalle va agrupado
# por competidor y por plataforma, no en una lista plana.
#
# Los nombres y los anuncios son de muestra, y la página lo dice. Escribir
# acá un competidor real, o una cifra que no salga de una corrida, sería
# exactamente lo que el reporte promete no hacer.
ejemplo:
  titulo: "Así llega cada reporte"
  nota: >-
    El detalle va agrupado por competidor y, dentro de cada uno, por
    plataforma. Cada anuncio lleva el enlace a su ficha pública, para que
    cualquier afirmación se pueda comprobar en un clic.
  pie: >-
    Ejemplo con datos de muestra. En su reporte van sus competidores y los
    anuncios que estuvieron al aire ese mes.
  asunto: "Competencia de su empresa"
  periodo: "Del 1 al 30 de septiembre"
  conteo:
    - etiqueta: "Nuevos"
      valor: "3"
      destacado: true
    - etiqueta: "Cambiaron"
      valor: "1"
    - etiqueta: "Se apagaron"
      valor: "2"
    - etiqueta: "Siguen"
      valor: "6"
  competidores:
    - nombre: "Competidor A"
      resumen: "3 anuncios en 7 piezas"
      bloques:
        - plataforma: "Meta (Facebook e Instagram)"
          anuncios:
            - referencia: "A1"
              estado: "nuevo"
              detalle: "3 piezas · desde el 22 de septiembre"
              texto: "Financiamiento a doce meses, sin intereses"
            - referencia: "A2"
              estado: "cambiado"
              detalle: "1 pieza · cambió el titular"
              texto: "Bajó el precio de anzuelo respecto del reporte anterior"
        - plataforma: "Google"
          anuncios:
            - referencia: "A3"
              estado: "nuevo"
              detalle: "3 piezas · búsqueda"
              texto: "La plataforma no publica el texto de este anuncio."
    - nombre: "Competidor B"
      resumen: "1 anuncio en 1 pieza"
      bloques:
        - plataforma: "Meta (Facebook e Instagram)"
          anuncios:
            - referencia: "B1"
              estado: "se apagó"
              detalle: "dejó de aparecer el 18 de septiembre"
              texto: "Promoción de temporada"

# ── El plan ──────────────────────────────────────────────────────────
# Los precios no van acá: salen de config/planes.yaml. Esto es el texto que
# los rodea. El Custom no se compra desde la página: su botón lleva al
# contacto de arriba. La opción de pagar el año completo no se muestra acá: se
# elige en el checkout.
plan_seccion:
  rotulo: "Los planes"
  titulo: "Un plan para empezar, o uno hecho a su medida"
  entrada: >-
    El de $25 cubre hasta cuatro competidores en Meta y Google, con el enlace
    a cada anuncio. Si es una agencia o necesita reportes más seguidos, armamos
    uno Custom con la frecuencia que necesite. Sin permanencia: puede cancelar
    cuando quiera.
  cotizado: "A cotizar"
  boton_contacto: "Conversemos"
  cierre: >-
    Desde $25, sin permanencia.

# ── Por qué sirve ────────────────────────────────────────────────────
argumentos:
  - titulo: "Cada afirmación tiene su enlace"
    texto: >-
      Todo lo que dice el reporte se puede verificar en un clic: cada anuncio
      que mencionamos enlaza a su ficha pública en la plataforma. Si algo no
      le cuadra, lo comprueba usted mismo en el momento.
  - titulo: "Lo que no se sabe, no se inventa"
    texto: >-
      Las plataformas no publican cuánto invirtió un competidor, ni su alcance,
      ni sus clics. Ningún proveedor los tiene. Nosotros no se los vamos a
      estimar: el reporte dice lo que se puede comprobar y marca lo que no.
  - titulo: "Le avisamos cuando no hay nada"
    texto: >-
      Si un competidor no está pautando, se lo decimos. Un reporte relleno
      para justificar lo que paga es la forma más rápida de que deje de
      leerlo.
  - titulo: "Revisión humana antes de cada envío"
    texto: >-
      El borrador lo arma el sistema; la versión que usted recibe la aprueba
      una persona. Es más lento y es a propósito.

# Lo que el cliente tiene que mandarnos para arrancar. Es el mismo contenido
# de docs/05-que-necesito-de-vos.md, en versión formulario.
formulario:
  titulo: "Empecemos"
  nota: >-
    Entre más nos cuente del negocio, mejor sale el reporte. El contexto que
    solo usted sabe es lo que separa un reporte correcto de uno útil.

# ── La página de aplicación (/aplicar) ───────────────────────
# El formulario salió de la portada y tiene su propia página, a la que se
# llega desde los botones de cada plan. Más adelante, ahí mismo se cobra.
aplicar:
  titulo: "Empecemos con su reporte"
  nota: >-
    Nos toma dos minutos. Entre más nos cuente del negocio, mejor sale el
    reporte: el contexto que solo usted sabe es lo que separa un reporte
    correcto de uno útil.
  competidores:
    titulo: "Sus competidores"
    opcional: >-
      Este bloque es opcional. Si prefiere, lo deja en blanco y los
      averiguamos nosotros.
    explicacion: >-
      Si no nos los indica, investigamos su industria y su zona y deducimos
      quiénes son. Lo hacemos bien, pero no le prometemos acertar: nadie
      conoce a su competencia como usted. Si hay alguien que le preocupa en
      particular, dígalo acá y lo cubrimos seguro.
    ayuda: >-
      De cada uno sirve su página de Facebook, su dominio, o los dos. Con uno
      solo alcanza: se cubre esa plataforma y se le avisa de la otra.
  cierre: >-
    Al enviar le mostramos un resumen para confirmar. No se activa nada ni se
    cobra nada hasta que usted lo confirme.

  # Los nombres de los pasos. Solo el primero es obligatorio: el resto mejora
  # el reporte pero no impide pedirlo. El paso del cobro se agrega acá cuando
  # haya proveedor conectado (ver docs/08-cobro-y-lanzamiento.md).
  pasos:
    - nombre: "Su empresa"
      corto: "Empresa"
    - nombre: "Contexto de su negocio"
      corto: "Contexto"
    - nombre: "Sus competidores"
      corto: "Competencia"
    - nombre: "Cómo nos conoció"
      corto: "Cómo nos conoció"

  # La encuesta del último paso. No cambia nada del reporte: sirve para saber
  # dónde vale la pena poner el tiempo. Por eso es opcional y va al final,
  # después de lo que sí importa para el producto.
  origen:
    titulo: "¿Cómo se enteró de PulseRival?"
    opcional: "Opcional"
    ayuda: >-
      Nos ayuda a saber dónde vale la pena poner el tiempo. No cambia nada de
      su reporte.
    etiqueta: "Elija la que más se acerque"
    opciones:
      - "Búsqueda en Google"
      - "Instagram o Facebook"
      - "LinkedIn"
      - "Alguien me lo recomendó"
      - "Un correo o un mensaje de ustedes"
      - "Un evento, una charla o un podcast"
      - "Un artículo o una nota de prensa"
    otro: "Otro"
    otro_ayuda: "¿Dónde fue?"
