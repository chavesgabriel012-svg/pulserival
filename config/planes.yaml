# ─────────────────────────────────────────────────────────────────────
#  Los planes que se venden. Precios y cadencias viven acá, no en el
#  código: cambiar un precio o agregar un plan no debería necesitar que
#  alguien entienda Python.
#
#  Cómo lo usa el sistema:
#    - `clave` es lo que se guarda en clientes.plan
#    - `visible: true` lo muestra en la landing. Un plan oculto sigue en el
#      catálogo: los clientes que ya lo tienen conservan su precio y su
#      cadencia, y volver a venderlo es cambiar esta línea.
#    - `checkout: true` se cobra desde la web con Paddle. Sin esto el plan
#      se vende a mano (Custom: link de pago armado en el panel de Paddle).
#    - `periodicidad` es semanal | mensual | custom. Custom no tiene cadencia
#      fija: la de cada cliente va en clientes.cadencia_dias.
#    - `ciclos` son las formas de pagar el plan (mensual, anual). Cada una
#      con su precio y, por entorno de Paddle, el id del precio (pri_...)
#      que se crea en el panel de Paddle: Catálogo > Productos.
#    - `recurrente: false` significa "un solo reporte y se acabó"
#
#  Lanzamiento de octubre 2026: la landing muestra dos tarjetas, el de
#  autoservicio (se compra en la web) y el Custom (se conversa). El anual no
#  es otro plan: es una forma de pagar el de autoservicio, y se elige en el
#  checkout. La prueba gratis y el semanal quedan ocultos por decisión de
#  producto, no porque falte algo técnico: volverlos visibles es
#  `visible: true`.
# ─────────────────────────────────────────────────────────────────────

planes:
  - clave: autoservicio
    nombre: "Reporte mensual"
    visible: true
    checkout: true
    # Precio de lista por mes. El anual equivale a $20 al mes: es el precio
    # original del plan, y se conserva como incentivo para pagar el año de
    # una vez (una comisión de Paddle al año en vez de doce).
    precio_usd: 25
    recurrente: true
    periodicidad: mensual
    cadencia_dias: 30
    resumen: "Un reporte por mes con lo que hizo su competencia en Meta y Google."
    para_quien: "Para seguir a los competidores que importan sin tener que mirarlos usted."
    cadencia_texto: "Cada 30 días"
    competidores_max: 4
    ciclos:
      mensual:
        nombre: "Mes a mes"
        precio_usd: 25
        cobro_texto: "$25 al mes"
      anual:
        nombre: "Todo el año"
        precio_usd: 240
        # Lo que se ve al lado del precio: el ahorro, en plata y no en %.
        equivale_mes_usd: 20
        ahorro_usd: 60
        cobro_texto: "$240 al año"
    # Ids de los precios en Paddle (pri_...). Se crean en el panel, uno por
    # ciclo y por entorno: los de sandbox no sirven en producción.
    paddle:
      sandbox:
        mensual: ""
        anual: ""
      production:
        mensual: ""
        anual: ""
    incluye:
      - "Un reporte cada 30 días"
      - "Hasta 4 competidores"
      - "Meta (Facebook e Instagram) y Google"
      - "Qué cambió respecto del mes anterior"
      - "El enlace a cada anuncio, para comprobarlo"

  - clave: prueba
    visible: false
    nombre: "Prueba gratis"
    precio_usd: 0
    # Un solo reporte, sin recurrencia. El periodo se calcula como el
    # semanal para que el reporte cubra una ventana con movimiento real.
    recurrente: false
    periodicidad: semanal
    cadencia_dias: 7
    resumen: "Un reporte completo de su competencia, sin costo y sin compromiso."
    para_quien: "Para ver de qué se trata antes de decidir nada."
    cadencia_texto: "Una sola vez"
    competidores_max: 3
    incluye:
      - "Un reporte con hasta 3 competidores"
      - "Anuncios activos en Meta y Google, con enlace a la fuente"
      - "Interpretación y recomendaciones, no solo una lista"

  - clave: mensual
    visible: false
    # El plan de antes de Paddle, a $20. Lo conservan los clientes que ya lo
    # tenían; uno nuevo entra por `autoservicio`.
    nombre: "Mensual (anterior)"
    precio_usd: 20
    recurrente: true
    periodicidad: mensual
    cadencia_dias: 30
    resumen: "Un reporte por mes. Para seguir el pulso sin saturarse."
    para_quien: "Para categorías estables, donde las campañas duran semanas."
    cadencia_texto: "Cada 30 días"
    competidores_max: 4
    incluye:
      - "Un reporte cada 30 días"
      - "Hasta 4 competidores"
      - "Qué cambió respecto del mes anterior"

  - clave: semanal
    visible: false
    nombre: "Semanal"
    precio_usd: 100
    recurrente: true
    periodicidad: semanal
    cadencia_dias: 7
    resumen: "Un reporte por semana. Para categorías donde el precio se mueve rápido."
    para_quien: "Para retail, servicios y todo lo que cambia de precio seguido."
    cadencia_texto: "Cada 7 días"
    competidores_max: 6
    incluye:
      - "Un reporte cada 7 días"
      - "Hasta 6 competidores"
      - "Detección de cambios semana a semana"
      - "Prioridad en el soporte"

  - clave: custom
    # Visible como tarjeta en la landing, sin checkout: el botón lleva a
    # conversar, y se cobra con un link de pago armado a mano en Paddle.
    visible: true
    nombre: "Custom"
    # Sin precio fijo: se acuerda por cliente y se guarda en
    # clientes.precio_mensual_usd.
    precio_usd: null
    recurrente: true
    # Sin cadencia fija: se define por cliente en clientes.cadencia_dias.
    # Se registra con `cli clientes agregar --plan custom --cadencia-dias N`.
    periodicidad: custom
    cadencia_dias: null
    # No se vende desde la web: se cotiza por agencia y se cobra con un link
    # de pago de Paddle armado a mano. La landing solo enlaza al contacto.
    resumen: "Frecuencia, competidores y alcance definidos con usted."
    para_quien: "Para agencias, cadenas y quien necesite seguir a más competidores."
    # OJO al vender: hasta que exista la cola de trabajos por cliente, el
    # ciclo corre cada 7 días (PULSERIVAL_CICLO_CADA_DIAS). Una frecuencia
    # menor no se cumple. Ver docs/08-cobro-y-lanzamiento.md.
    cadencia_texto: "La que acordemos"
    competidores_max: null
    incluye:
      - "La frecuencia de reportes que acordemos"
      - "Los competidores que necesite"
      - "Ajustes al formato del reporte"
      - "Precio según frecuencia y cantidad de competidores"
