# Corre los tests en cada push. Si algo se rompe, te enterás acá y no
# un lunes a las 5 a.m. con el reporte del cliente en juego.
name: Pruebas

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      - name: La demo tiene que correr de punta a punta
        run: python -m pulserival.cli demo
