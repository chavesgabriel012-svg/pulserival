# ─────────────────────────────────────────────────────────────────────
#  Prueba real de los scrapers, a demanda.
#
#  Corre en GitHub con el secreto APIFY_TOKEN del repositorio: el token
#  nunca sale de acá, no hace falta compartirlo con nadie.
#
#  Para qué sirve: confirmar, ANTES de vender o cargar un cliente, que
#    1. el token funciona;
#    2. ese anunciante tiene anuncios en la biblioteca pública de Costa Rica;
#    3. los campos que devuelve el actor siguen coincidiendo con el mapeo
#       de config/fuentes.yaml.
#
#  Cómo se corre: pestaña Actions -> "Prueba de scraper" -> Run workflow.
#  Cuesta centavos: el límite por defecto es de 10 anuncios.
# ─────────────────────────────────────────────────────────────────────
name: Prueba de scraper

on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: "Dónde buscar"
        default: meta
        type: choice
        options: [meta, google]
      consulta:
        description: "Nombre del anunciante (como aparece en la biblioteca)"
        required: true
        type: string
      dominio:
        description: "Dominio del anunciante (solo para Google, ej: gollo.com)"
        required: false
        type: string
      pagina:
        description: "URL de la página de Facebook (más preciso que la consulta)"
        required: false
        type: string
      limite:
        description: "Máximo de anuncios a traer (se paga por anuncio)"
        default: "10"
        type: string

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar los secretos del repositorio
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Solo se imprimen los NOMBRES. Los valores nunca se tocan.
          SECRETOS_VISIBLES: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'FIN'
          import json, os, sys

          nombres = sorted(json.loads(os.environ["SECRETOS_VISIBLES"]))
          print("Secretos que este workflow puede ver (solo los nombres):")
          for n in nombres:
              print(f"  - {n}")
          if not nombres:
              print("  (ninguno)")

          esperados = ("APIFY_TOKEN", "GEMINI_API_KEY", "GROQ_API_KEY")
          print()
          for clave in esperados:
              valor = os.environ.get(clave) or ""
              estado = f"presente ({len(valor)} caracteres)" if valor else "VACÍO"
              print(f"  {clave}: {estado}")

          if not os.environ.get("APIFY_TOKEN"):
              print()
              print("::error::APIFY_TOKEN llega vacío. Arriba está la lista de los secretos "
                    "que este workflow sí ve. Causas típicas: se guardó como 'Environment "
                    "secret' o 'Dependabot secret' en vez de 'Actions -> Repository secret', "
                    "o se guardó con otro nombre, o en otro repositorio.")
              sys.exit(1)
          FIN

      - name: Llamar al scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python -m pulserival.cli prueba-scraper \
            --plataforma "${{ inputs.plataforma }}" \
            --consulta "${{ inputs.consulta }}" \
            ${{ inputs.dominio && format('--dominio "{0}"', inputs.dominio) || '' }} \
            ${{ inputs.pagina && format('--pagina "{0}"', inputs.pagina) || '' }} \
            --limite "${{ inputs.limite }}" \
            --mostrar 5

      - name: Guardar la respuesta cruda para revisar el mapeo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: respuesta-cruda-${{ github.run_number }}
          path: datos/crudo/
          retention-days: 30
          if-no-files-found: ignore
